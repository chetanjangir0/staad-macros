name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: STAAD_EXT

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: STAAD_EXT/pyproject.toml

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip pyinstaller .[dev]

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: pyinstaller --noconfirm --clean STAAD_EXT.spec

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version "5.*"

      - name: Build MSI installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, for example v0.2.0."
          }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          wix build `
            -arch x64 `
            -define "Version=$version" `
            -bindpath "dist\STAAD_EXT" `
            -pdbtype none `
            -out "dist\STAAD_EXT-windows-x64.msi" `
            "packaging\STAAD_EXT.wxs"

      - name: Package executable and create checksums
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\STAAD_EXT\*" `
            -DestinationPath "dist\STAAD_EXT-windows-x64.zip"
          foreach ($artifact in @(
            "STAAD_EXT-windows-x64.zip",
            "STAAD_EXT-windows-x64.msi"
          )) {
            (Get-FileHash "dist\$artifact" -Algorithm SHA256).Hash.ToLower() +
              "  $artifact" |
              Set-Content "dist\$artifact.sha256" -Encoding ascii
          }
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            STAAD_EXT/dist/STAAD_EXT-windows-x64.zip
            STAAD_EXT/dist/STAAD_EXT-windows-x64.zip.sha256
            STAAD_EXT/dist/STAAD_EXT-windows-x64.msi
            STAAD_EXT/dist/STAAD_EXT-windows-x64.msi.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
