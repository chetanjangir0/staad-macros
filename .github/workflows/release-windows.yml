name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: STAAD_EXT

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: STAAD_EXT/pyproject.toml

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip pyinstaller .[dev]

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: pyinstaller --noconfirm --clean STAAD_EXT.spec

      - name: Package executable and create checksum
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\STAAD_EXT\*" `
            -DestinationPath "dist\STAAD_EXT-windows-x64.zip"
          (Get-FileHash `
            "dist\STAAD_EXT-windows-x64.zip" `
            -Algorithm SHA256).Hash.ToLower() +
            "  STAAD_EXT-windows-x64.zip" |
            Set-Content `
              "dist\STAAD_EXT-windows-x64.zip.sha256" `
              -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            STAAD_EXT/dist/STAAD_EXT-windows-x64.zip
            STAAD_EXT/dist/STAAD_EXT-windows-x64.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
